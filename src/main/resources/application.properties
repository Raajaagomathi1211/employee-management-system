spring.application.name=employee-management-system
spring.data.mongodb.uri=mongodb://localhost:27017/employee_management_system
server.port=8080
spring.jackson.serialization.write-dates-as-timestamps=false

# ---------------------------------------------------------------------------
# Email notifications (leave applied -> admin, leave approved/rejected -> employee)
# ---------------------------------------------------------------------------
# Set app.mail.enabled=true only after filling in the SMTP settings below,
# otherwise the app will simply skip sending emails (no crash, just a log line).
app.mail.enabled=false

# The email address that receives "new leave request" notifications.
app.mail.admin-email=muthumari0605@gmail.com

# The "from" address shown on outgoing emails. For Gmail this must be the
# same account as spring.mail.username.
app.mail.from=muthumari0605@gmail.com

# --- SMTP server settings ---
# Example below is configured for Gmail. If you use Gmail you MUST create an
# "App Password" (Google Account -> Security -> 2-Step Verification -> App
# passwords) and use that 16-character password here, NOT your normal Gmail
# password.
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=muthumari0605@gmail.com
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
